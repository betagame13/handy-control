<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><title>Handy Overlay</title><style>
  html,body{ margin:0; height:100%; overflow:hidden; background:transparent; font-family:"Segoe UI",system-ui,sans-serif; }
  body{ display:flex; align-items:flex-start; }

  .ovwrap{ position:relative; margin:44px 14px 14px 14px; }   /* margem extra em cima pros chifres do modo diabo */
  .ov{ position:relative; width:410px; z-index:1;
    background: linear-gradient(135deg, rgba(20,14,30,0.84), rgba(34,16,46,0.84));
    border:1px solid rgba(255,45,155,0.55); border-radius:16px; padding:13px 15px;
    box-shadow:0 0 26px rgba(162,60,255,0.35); color:#fff; overflow:hidden;
    transition: border-color .5s, box-shadow .5s, background .5s; }

  .ov.ctrl{ border-color:#b026ff;
    background:linear-gradient(135deg, rgba(30,0,48,0.92), rgba(16,0,32,0.92));

    animation:devilThrob 1.1s ease-in-out infinite alternate; }

    to{ box-shadow:0 0 56px rgba(190,60,255,0.95), inset 0 0 50px rgba(140,0,255,0.38); } }
  .ov.ctrl .ov-pat{ background:linear-gradient(135deg,#b026ff,#e29bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .ov.ctrl .ov-sub{ color:#d6a8ff; }
  .ov.ctrl .ov-right-lbl{ color:#c08fff; }
  .ov.ctrl .ov-right-val{ color:#c44dff; }
  .ov.ctrl .ov-emoji-wrap{ animation:devilShake 1.6s ease-in-out infinite; filter:drop-shadow(0 0 9px rgba(176,38,255,.85)); }

  .ov.fire{ border-color:#ff7a00; background:linear-gradient(135deg, rgba(60,20,0,0.9), rgba(80,10,0,0.9));
    box-shadow:0 0 40px rgba(255,90,0,0.65); animation:fireGlow 1.1s ease-in-out infinite alternate; }
  @keyframes fireGlow{ from{box-shadow:0 0 34px rgba(255,90,0,0.55);} to{box-shadow:0 0 52px rgba(255,150,0,0.9);} }

  .ov-head{ display:flex; align-items:center; gap:13px; margin-bottom:10px; }
  .ov-emoji-wrap{ position:relative; width:50px; height:50px; flex-shrink:0; }
  .oe{ position:absolute; inset:0; width:50px; height:50px; transition:opacity .6s ease; opacity:0; }
  .ov-info{ flex:1; min-width:0; }
  .ov-pat{ display:inline-block; font-size:20px; font-weight:800; background:linear-gradient(135deg,#ff2d9b,#a23cff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .ov.fire .ov-pat{ background:linear-gradient(135deg,#ffd000,#ff5a00); -webkit-background-clip:text; }
  .ov-sub{ display:inline-block; font-size:14px; color:#cbb6d6; }
  .ov.fire .ov-sub{ color:#ffd9a8; }
  .ov-right{ text-align:right; flex-shrink:0; }
  .ov-right-lbl{ display:inline-block; font-size:10px; color:#9a86a6; text-transform:uppercase; letter-spacing:.5px; }
  .ov-right-val{ display:inline-block; font-size:22px; font-weight:800; color:#ff2d9b; font-variant-numeric:tabular-nums; }
  .ov.fire .ov-right-val{ color:#ff8c1a; }
  .ov-chartwrap{ position:relative; height:70px; }
  .ov-chartwrap canvas{ display:block; width:100%; height:70px; }   /* SO o grafico — nao as canvas das correntes */

  .ov-faixas{ display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:9px; }
  .fx{ display:block; text-align:center; font-size:13px; font-weight:700; padding:4px 8px; border-radius:10px; border:1px solid; }
  .ov-rank{ margin-top:9px; font-size:14px; color:#d9c8e2; line-height:1.5; }
  .ov-rank .rk-h{ color:#ffd24d; font-weight:800; } .ov-rank b{ color:#fff; }

  .ov.flash{ animation:flash .6s ease; }
  @keyframes flash{ 0%{filter:none;} 30%{filter:brightness(1.5);} 100%{filter:none;} }
  .tip-pop{ position:absolute; bottom:4px; font-size:17px; font-weight:800; text-shadow:0 0 8px rgba(255,45,155,.8); pointer-events:none; white-space:nowrap; animation:pop 1.8s ease forwards; z-index:9; }
  .tip-pop b{ color:#fff; }
  @keyframes pop{ 0%{opacity:0; transform:translateY(6px) scale(.6);} 14%{opacity:1; transform:translateY(-6px) scale(1.1);} 100%{opacity:0; transform:translateY(-60px) scale(1);} }

  /* ====== DECORACAO MODO DEMONIO (correntes + cadeado + chifres) ====== */
  .ov-content{ position:relative; z-index:2; }
  .decoClip{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; border-radius:16px; }
  .deco{ position:absolute; inset:0; opacity:0; transition:opacity .35s; }
  .ov.ctrl .deco{ opacity:1; }
  .chain{ position:absolute; left:50%; top:50%; }
  .chainInner{ display:block; opacity:.55; transform:translate(-50%,-50%) rotate(var(--rot,0deg)); }

  .ovwrap.brilho .lock svg{ filter:drop-shadow(0 0 9px rgba(220,150,255,1)); }

  .chifre{ position:absolute; bottom:-21px; width:48px; height:58px; pointer-events:none; filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));
    opacity:0; transform:translateY(14px) scale(.5); transform-origin:bottom center; transition:opacity .4s, transform .4s cubic-bezier(.2,1.5,.4,1); }
  .chifre.esq{ left:30px; } .chifre.dir{ right:30px; }
  .ovwrap.ctrl.horns .chifre{ opacity:1; transform:translateY(0) scale(1); }
  .ovwrap.ctrl.horns .chifre.dir{ transform:translateY(0) scale(1) scaleX(-1); }
  /* entrada: corrente tracada GRANDE das pontas de cima, desce, encolhe pro normal */
  .ov.ctrl .cA .chainInner{ animation:chainGrowA .5s ease-out both; }
  .ov.ctrl .cB .chainInner{ animation:chainGrowB .5s ease-out both; }
  .ov.ctrl .lock{ animation:lockSnap .4s .42s cubic-bezier(.2,1.6,.4,1) both; }
  .ovwrap.ctrl.brilho .dvl-flash{ animation:flashPop .5s .38s ease-out both; }
  @keyframes chainGrowA{ 0%{ -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.3);} 65%{ transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.28);} 100%{ -webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);} }
  @keyframes chainGrowB{ 0%{ -webkit-clip-path:inset(0 0 0 100%); clip-path:inset(0 0 0 100%); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.3);} 65%{ transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.28);} 100%{ -webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);} }
  @keyframes lockSnap{ 0%{opacity:0;transform:scale(0)} 55%{opacity:.85;transform:scale(1.4)} 75%{transform:scale(.88)} 100%{opacity:.85;transform:scale(1)} }
  @keyframes flashPop{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.2)} 35%{opacity:1} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)} }
  /* saida (reverso): corrente cresce e se desfaz da ponta de baixo de volta pra de cima; cadeado some */
  .ov.ctrl.exiting .cA .chainInner{ animation:chainShrinkA .5s ease-in both; }
  .ov.ctrl.exiting .cB .chainInner{ animation:chainShrinkB .5s ease-in both; }
  .ov.ctrl.exiting .lock{ animation:lockOut .34s ease-in both; }
  @keyframes chainShrinkA{ 0%{ -webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);} 35%{ transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.28);} 100%{ -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.3);} }
  @keyframes chainShrinkB{ 0%{ -webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1);} 35%{ transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.28);} 100%{ -webkit-clip-path:inset(0 0 0 100%); clip-path:inset(0 0 0 100%); transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.3);} }
  @keyframes lockOut{ 0%{opacity:.85; transform:scale(1);} 100%{opacity:0; transform:scale(0);} }
</style></head><body>

<script type="module">

const TIP_PUBKEY = {"crv":"P-256","ext":true,"key_ops":["verify"],"kty":"EC","x":"DgEZ68jzErO27HVE61OLv9GDsn-R0tWn-fjxYXgacVU","y":"BgAUUvxxSGGCuK3et71RcDm1pjy-Rp4dpdid6ClfaPw"};
let _tipPubP=null;
function _getTipPub(){ if(!_tipPubP) _tipPubP=crypto.subtle.importKey('jwk', TIP_PUBKEY, {name:'ECDSA',namedCurve:'P-256'}, false, ['verify']); return _tipPubP; }
function _b64ToBuf(b){ const s=atob(b); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u.buffer; }
async function verifyTip(d){ try{ if(!d||!d.sig) return false; const k=await _getTipPub();
  return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, k, _b64ToBuf(d.sig), new TextEncoder().encode(d.amount+'|'+(d.name||'')+'|'+d.ts)); }catch(e){ return false; } }
async function verifyConfig(d){ try{ if(!d||!d.sig||!Array.isArray(d.faixas)) return false; const k=await _getTipPub();
  const canon=d.faixas.map(f=>f.min+','+f.max+','+f.vel+','+f.dur).join(';')+'|'+d.ts;
  return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, k, _b64ToBuf(d.sig), new TextEncoder().encode(canon)); }catch(e){ return false; } }

const ROOT='https://raw.githubusercontent.com/Tarikul-Islam-Anik/Microsoft-Teams-Animated-Emojis/master/Emojis/Smilies/';
const EM={ sleep:ROOT+'Sleeping%20Face.png', smirk:ROOT+'Smirking%20Face.png', flush:ROOT+'Flushed%20Face.png',
           hot:ROOT+'Hot%20Face.png', drool:ROOT+'Drooling%20Face.png', devil:ROOT+'Smiling%20Face%20with%20Horns.png',
           fire:ROOT+'Heart%20on%20Fire.png' };
Object.values(EM).forEach(u=>{ const i=new Image(); i.src=u; });

const COLORS=['#64b5f6','#81c784','#ffb74d','#f48fb1'];
let FAIXAS=[ {min:1,max:9,vel:20,dur:3,color:COLORS[0]}, {min:10,max:49,vel:50,dur:7,color:COLORS[1]},
             {min:50,max:99,vel:75,dur:12,color:COLORS[2]}, {min:100,max:99999,vel:100,dur:20,color:COLORS[3]} ];
function faixaFor(a){ for(const f of FAIXAS){ if(a>=f.min&&a<=f.max)return f; } return FAIXAS[FAIXAS.length-1]; }
function rebuildFaixas(){ const el=document.getElementById('faixas'); el.innerHTML='';
  FAIXAS.forEach(f=>{ const c=document.createElement('span'); c.className='fx'; c.style.color=f.color; c.style.borderColor=f.color+'88'; c.style.background=f.color+'14';
    c.textContent=(f.max>=9999?f.min+'+':f.min+'-'+f.max)+' → '+f.vel+'% · '+f.dur+'s'; el.appendChild(c); }); }
rebuildFaixas();

let oeA=document.getElementById('oeA'), oeB=document.getElementById('oeB'), front=oeA, back=oeB, curUrl='';
function setEmoji(u){ if(u===curUrl)return; curUrl=u; back.src=u; back.style.opacity=1; front.style.opacity=0; const t=front; front=back; back=t; }
setEmoji(EM.sleep);

// ====== DECORACAO MODO DEMONIO ======
const LOCK_SVG='<svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c2ff"/><stop offset="1" stop-color="#b026ff"/></linearGradient></defs>'
  +'<path d="M14 22 v-5 a10 10 0 0 1 20 0 v5" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round"/>'
  +'<rect x="9" y="21" width="30" height="22" rx="5" fill="url(#lg)" stroke="#7a00cc" stroke-width="1.5"/>'
  +'<circle cx="24" cy="30" r="3.4" fill="#3a0060"/><rect x="22.4" y="31.5" width="3.2" height="7" rx="1.5" fill="#3a0060"/></svg>';
document.querySelector('.lock').innerHTML=LOCK_SVG;
const CHAIN_MUL=0.68; let _maskN=0, _wasCtrl=false, _exitT=null;
const dOv=document.getElementById('ov'), wrapEl=document.getElementById('ovwrap'), decoEl=document.getElementById('deco');
function chainCanvas(len, mul){ const cv=document.createElement('canvas'); len=len|0; mul=mul||1;
  const size=Math.round(27*mul), step=size*0.56, pad=4, n=Math.max(1,Math.round(len/step));
  cv.width=Math.round(pad*2+step*n); cv.height=size+12;
  const x=cv.getContext('2d'), cy=cv.height/2; x.font=size+'px "Segoe UI Emoji","Noto Color Emoji",serif'; x.textAlign='center'; x.textBaseline='middle';
  for(let i=0;i<=n;i++){ const px=pad+step*i; x.save(); x.translate(px,cy); x.rotate(Math.PI/2); x.fillText('⛓️',0,0); x.restore(); }
  return cv; }
function buildChains(){ decoEl.innerHTML='';
  const r=dOv.getBoundingClientRect(), W=r.width, H=r.height; if(W<10||H<10) return;
  const len=Math.round(Math.hypot(W,H)*0.99), ang=Math.atan2(H,W)*180/Math.PI;
  [[ang,'cA'],[-ang,'cB']].forEach(p=>{ const ch=document.createElement('div'); ch.className='chain '+p[1]; const ic=document.createElement('div'); ic.className='chainInner'; ic.style.setProperty('--rot', p[0]+'deg'); ic.appendChild(chainCanvas(len, CHAIN_MUL)); ch.appendChild(ic); decoEl.appendChild(ch); }); }
function applyMask(){ const r=dOv.getBoundingClientRect(), Wp=Math.round(r.width), Hp=Math.round(r.height); let rects='';
  [['.ov-pat',0,3,5],['.ov-sub',0,3,2],['.ov-right-lbl',0,3,1],['.ov-right-val',0,3,5],['.fx',0,10,0]].forEach(cfg=>{ const sel=cfg[0],padX=cfg[1],rx=cfg[2],vsh=cfg[3];
    dOv.querySelectorAll(sel).forEach(e=>{ const b=e.getBoundingClientRect(); if(b.width<2)return; const x=b.left-r.left, y=b.top-r.top;
      rects+='<rect x="'+(x-padX).toFixed(1)+'" y="'+(y+vsh).toFixed(1)+'" width="'+(b.width+padX*2).toFixed(1)+'" height="'+(b.height-vsh*2).toFixed(1)+'" rx="'+rx+'" fill="black"/>'; }); });
  const mg=1, base='<rect x="'+mg+'" y="'+mg+'" width="'+(Wp-mg*2)+'" height="'+(Hp-mg*2)+'" rx="15" fill="white"/>';
  const old=dOv.querySelector('.maskdef'); if(old)old.remove();
  const id='mk'+(_maskN++);
  dOv.insertAdjacentHTML('beforeend','<svg class="maskdef" width="'+Wp+'" height="'+Hp+'" style="position:absolute;left:-9999px"><mask id="'+id+'" maskUnits="userSpaceOnUse" x="0" y="0" width="'+Wp+'" height="'+Hp+'">'+base+rects+'</mask></svg>');
  decoEl.style.webkitMaskImage='url(#'+id+')'; decoEl.style.maskImage='url(#'+id+')'; }
function syncDeco(){ const lockwrap=dOv.querySelector('.lockwrap');
  if(controlled && !_wasCtrl){ _wasCtrl=true; clearTimeout(_exitT);
    dOv.classList.remove('exiting'); wrapEl.classList.remove('exiting');

let heat=0, controlled=false, controlRem=0, activeVel=0, tipUntil=0;
let qTips=[], qTotal=0;   // tk recebidos DURANTE o controle: pausados (visual) e ativados quando o controle acaba

function resize(){ const w=canvas.parentElement.offsetWidth,h=70,dpr=devicePixelRatio||1; canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }

const t0=performance.now();
function patVel(t){ const idx=Math.floor(t/6)%4, lt=t%6;
  if(idx===0) return 80*((Math.sin(lt*1.6)+1)/2);
  if(idx===1){ const ph=lt%2; if(ph<0.45)return 80; if(ph<0.75)return 20; if(ph<1.2)return 72; return 6; }
  if(idx===2){ const ph=lt%4; return ph<2.4?80:0; }
  return 80*(0.15+0.85*((lt%4)/4)); }
function draw(fire){ const w=canvas.width/(devicePixelRatio||1),h=70; ctx.clearRect(0,0,canvas.width,canvas.height);
  if(samples.length<2)return; const now=performance.now(),tStart=now-WINDOW; const clr=fire?'#ff7a00':(controlled?'#b026ff':'#ff2d9b');
  const pts=samples.map(s=>({x:((s.t-tStart)/WINDOW)*w,y:h-(s.v/100)*h*0.8-6}));
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  const last=pts[pts.length-1]; ctx.lineTo(last.x,h); ctx.lineTo(pts[0].x,h); ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,clr+'66'); g.addColorStop(1,clr+'00'); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.strokeStyle=clr; ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.shadowColor=clr; ctx.shadowBlur=10; ctx.stroke(); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(last.x,last.y,3.5,0,7); ctx.fillStyle=clr; ctx.fill(); }
let lastT=performance.now();
function loop(){ const now=performance.now(), dt=(now-lastT)/1000; lastT=now; const t=(now-t0)/1000;
  const active = now < tipUntil;
  const fire = !controlled && heat >= 99.5;
  if(!active && !controlled){ heat=Math.max(0, heat - 6*dt); activeVel=0; }
  let v = controlled ? patVel(t) : (active ? activeVel : 0);
  samples.push({t:now,v}); const cut=now-WINDOW-200; while(samples.length&&samples[0].t<cut)samples.shift();
  draw(fire);
  const ov=document.getElementById('ov'), pat=document.getElementById('pat');
  syncDeco(); ov.classList.toggle('fire', fire);
  if(controlled){ setEmoji(EM.devil); pat.textContent='NO CONTROLE';
    document.getElementById('sub').textContent = qTotal>0 ? ('⏸️ '+qTotal+' tk na fila — ativam ao fim') : 'Alguém assumiu o controle!';
    document.getElementById('rlbl').textContent='Tempo'; document.getElementById('rval').textContent=fmt(Math.max(0,controlRem)); }
  else if(fire){ setEmoji(EM.fire); pat.textContent='PEGANDO FOGO!'; document.getElementById('sub').textContent='Tesão no máximo!';
    document.getElementById('rlbl').textContent='Tempo'; document.getElementById('rval').textContent=fmt(Math.max(0,(tipUntil-now)/1000)); }
  else { setEmoji(heatEmoji(heat)); pat.textContent='Aguardando'; document.getElementById('sub').textContent=heatTxt(heat);
    document.getElementById('rlbl').textContent='Tesão'; document.getElementById('rval').textContent=Math.round(heat)+'%'; }
  requestAnimationFrame(loop); }
resize(); buildChains(); requestAnimationFrame(loop);
function fmt(s){ s=Math.round(s); const m=Math.floor(s/60),x=s%60; return m+':'+String(x).padStart(2,'0'); }

const totals={};
function renderRank(){ const el=document.getElementById('rank');
  const arr=Object.keys(totals).map(n=>[n,totals[n]]).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(!arr.length){ el.innerHTML='<span class="rk-h">🏆 Top:</span> ainda sem tk'; return; }
  const med=['🥇','🥈','🥉']; el.innerHTML='<span class="rk-h">🏆 Top:</span> '+arr.map((x,i)=>med[i]+' <b>'+esc(x[0])+'</b> '+(Number(x[1])||0)).join('  ·  '); }

const ovEl=document.getElementById('ov'), wrap=document.getElementById('chartwrap');
function tip(a, name){ a=Number(a)||0; if(a<=0||a>100000) return; name=String(name||'Anônimo').slice(0,24); const f=faixaFor(a); const now=nowMs();
  totals[name]=(totals[name]||0)+a; renderRank();   // sempre conta no ranking
  const fp=(a>=100); const p=document.createElement('div'); p.className='tip-pop'; p.style.color=(controlled?'#c08fff':(fp?'#ff8c1a':f.color));
  p.innerHTML='<b>'+esc(name)+'</b> +'+a+' tk '+(controlled?'⏸️':(fp?'\u{1F525}':'\u{1F496}')); p.style.left=(18+Math.random()*150)+'px';
  wrap.appendChild(p); setTimeout(()=>p.remove(),1800);
  if(controlled){ qTips.push({a:a, vel:f.vel, dur:f.dur}); qTotal+=a; return; }   // PAUSA: guarda o efeito; ativa quando o controle acabar
  heat=Math.min(100, heat + a);
  activeVel=Math.max(now<tipUntil?activeVel:0, f.vel);
  tipUntil=Math.max(now, tipUntil) + f.dur*1000;
  ovEl.classList.remove('flash'); void ovEl.offsetWidth; ovEl.classList.add('flash'); }
// Ativa os tk que ficaram na fila durante o controle (efeito em sequencia: soma os tempos)
function flushQueuedTips(){ if(!qTips.length) return; const now=nowMs();
  qTips.forEach(q=>{ heat=Math.min(100, heat+q.a); activeVel=Math.max(activeVel, q.vel); tipUntil=Math.max(now, tipUntil)+q.dur*1000; });
  qTips=[]; qTotal=0; }

setInterval(()=>{ if(controlled && controlRem>0) controlRem-=1; },1000);   // só conta o display; quem liga/desliga e o handy/command

// ===== FIREBASE: liga nos dados reais =====
// Faixas (sincroniza com a extensão)
onValue(ref(db,'handy/config'), async snap=>{ const d=snap.val();
  if(!(await verifyConfig(d))) return;   // só config ASSINADA pela extensão
  FAIXAS = d.faixas.slice(0,8).map((f,i)=>({
    min:+f.min||0, max:+f.max||0,
    vel:Math.max(0,Math.min(100,+f.vel||0)), dur:Math.max(0,Math.min(600,+f.dur||0)),
    color:(/^#[0-9a-fA-F]{3,8}$/.test(f.color)?f.color:COLORS[i%COLORS.length])
  }));
  rebuildFaixas(); if(controlled) requestAnimationFrame(applyMask);
});
// Tips (valor + nome) — dispara o tip() quando chega um novo
let lastTipTs = Date.now();
onValue(ref(db,'handy/tips'), async snap=>{ const d=snap.val();
  if(!d || !d.ts || d.ts<=lastTipTs) return;
  if(!(await verifyTip(d))) return;   // ignora tip sem assinatura valida (anti-fake)
  lastTipTs=d.ts; tip(d.amount, d.name);
});
// Controle derivado do handy/command (só TOKEN VÁLIDO escreve lá -> não dá pra fingir 😈)
let _lastCmdAt=0, _demoOn=false;
onValue(ref(db,'handy/command'), snap=>{ if(_demoOn) return;   // no modo teste (t()) ignora o Firebase real
  const c=snap.val()||{};
  if(c && (c.type==='start' || c.type==='velocity')){ controlled=true; controlRem=Number(c.rem)||0; _lastCmdAt=Date.now(); }
  else if(c && c.type==='stop'){ controlled=false; }
});
setInterval(()=>{ if(controlled && !_demoOn && Date.now()-_lastCmdAt>8000) controlled=false; }, 1000);  // 8s sem comando = parou

// ===== TESTE pelo console =====  t(1)=controle  t(0)=desliga  t(2)=+20tk  t(3)=reset
window.t=function(n){
  if(n===1){ _demoOn=true; controlled=true; controlRem=60; console.log('[teste] CONTROLE ligado (modo demonio)'); }
  else if(n===0){ _demoOn=false; controlled=false; console.log('[teste] controle desligado'); }
  else if(n===2){ tip(20,'Teste'); console.log('[teste] +20 tk enviado'); }
  else if(n===3){ _demoOn=false; controlled=false; heat=0; controlRem=0; activeVel=0; tipUntil=0; for(const k in totals)delete totals[k]; renderRank(); console.log('[teste] resetado'); }
  else console.log('use: t(1)=controle, t(0)=desliga, t(2)=+20tk, t(3)=reset');
};
console.log('%cTESTE no console -> t(1)=controle  t(0)=desliga  t(2)=+20tk  t(3)=reset','color:#b026ff;font-weight:bold;font-size:13px');
</script>
